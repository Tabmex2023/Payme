ersona.","action":"Descubra cómo funciona PayPal.Me","personal_space":"Su espacio personal para recibir pagos","phone_1_title":"Para usted","phone_1_contents":"Comparta el link a su página de PayPal.Me con amigos y familiares. Podrá dividir la cuenta de una comida, recaudar dinero para un regalo o devolver un pago a un amigo.","phone_1_link":"Primeros pasos","phone_2_title":"Para sus actividades profesionales","phone_2_contents":"Tanto si diseña sitios web, como si vende sus creaciones en Internet, los formatos de pago o recordatorios de pago ya son cosa del pasado. Para recibir pagos, solamente tiene que compartir su link.","phone_2_link":"Ver detalles","phone_3_title":"Para su negocio","phone_3_contents":"Sus clientes podrán completar un pedido o reservar un servicio simplemente haciendo clic en un link. Usted, con su cuenta empresas, podrá beneficiarse de la Protección al Vendedor.","phone_3_link":"Ver detalles","how":"Cómo funciona PayPal.Me","title_1":"Elija su propio link.","para_1":"Cree su propio link de PayPal.Me y compártalo inmediatamente con quien desee: amigos, clientes o socios.","para_1b":"Si aún no tiene una cuenta PayPal, puede registrarse de forma rápida y sin costo. Y podrá comenzar a aceptar pagos de cualquier persona al instante.","title_2":"Comparta su link fácilmente.","para_2":"Comparta su link de PayPal.Me como desee: en un correo electrónico, un mensaje de texto, en un chat, o incluso en su tarjeta de visita.","title_3":"Reciba pagos rápidamente.","para_3":"Sus amigos, familiares o clientes solo tienen que ir a su link, ingresar el importe y... ¡listo! Por lo general, los fondos llegan a su cuenta PayPal en cuestión de segundos.","why":"¿Por qué debería utilizar PayPal.Me?","reason_1_title":"Es muy sencillo.","reason_1_text":"No hay nada más fácil que un clic. Además, es la mejor forma de recordarle a alguien que le debe un pago. Solo tiene que compartir su link y... ¡listo!","reason_2_title":"Si es gratis, es aun mejor.","reason_2_text":"Ha entendido bien: solicitar pagos de cualquier persona no tiene costo. Ni para usted ni para ellos.","reason_3_title":"Solicite un pago a cualquier persona","reason_3_text":"¿Quién tiene tiempo para firmar un cheque o realizar complicadas transferencias bancarias? Con PayPal.Me, cualquier persona que tenga una cuenta PayPal puede pagarle al instante.","reason_4_title":"Más seguro para usted y para su negocio","reason_4_text":"Al utilizar PayPal.Me para su negocio, usted y sus clientes se benefician de nuestros Programas de Protección. Más seguro para todos.","get_your":"Obtenga su link de PayPal.Me hoy mismo.","safer":"PayPal.Me es una forma rápida, fácil y más segura de que sus amigos, familiares o clientes le envíen pagos.","grab":"Crear enlace ahora","questions":"¿Tiene alguna duda?","check_faq":"Consulte nuestras preguntas frecuentes.","new_terms":"Al crear su link de PayPal.Me, acepta nuestra <a href=\"https://www.paypal.com/{coBrand}/webapps/mpp/ua/privacy-full\" target=\"_blank\">política de privacidad</a> y nuestros <a href=\"https://www.paypal.com/paypalme/pages/terms\" target=\"_blank\">términos y condiciones</a>. La información que se muestra en su link de PayPal.Me se puede compartir y otros usuarios pueden visualizarla."},"new_ladning":{"business":"PayPal.Me también está disponible para empresas.","business_link":"Obtener más información"}},"marketing_pages/terms_v2":{"terms_v2":{"title_general":"Términos y condiciones de PayPal.Me","content_general_1":"El servicio PayPal.Me (<strong>“Servicio”</strong>) es proporcionado por PayPal Inc. (<strong>“PayPal”</strong>) y le permite crear una URL de PayPal.Me personalizada (<strong>“link de PayPal.Me”</strong>), que a su vez le permite crear una página de PayPal.Me personalizada mediante la cual pueden encontrarlo, reconocerlo y realizar transacciones con usted (cada página se define como <strong>“página de PayPal.Me”</strong>).  Su página de PayPal.Me mostrará su link de PayPal.Me, su nombre o el nombre de su empresa, su foto de perfil o logotipo y la ciudad asociada a su cuenta PayPal (<strong>“información de PayPal.Me”</strong>).  La información de su PayPal.Me estará visible para cualquiera que visite su página de PayPal.Me, de modo que puedan verificar fácilmente que le están pagando al destinatario correcto.","content_general_1_MYKR":"El servicio PayPal.Me (<strong>\"Servicio\"</strong>) le permite crear una página personalizada de PayPal.Me (<strong>\"PPM\"</strong>) donde otras personas pueden encontrarlo, reconocerlo y realizar transacciones con usted. Su página de PayPal.Me mostrará su nombre o el nombre de su negocio, la foto de perfil o logotipo, y la ubicación asociada a su cuenta PayPal. La información de su página de PayPal.Me estará visible para cualquiera que visite dicha página, con la intención de que los usuarios puedan verificar fácilmente que le están enviando el pago al destinatario correcto.","content_general_2":"Puede utilizar un link de PayPal.Me para fines personales o comerciales para solicitar, cobrar y recibir pagos de otros usuarios de PayPal.  El uso del servicio está sujeto a estos términos y condiciones de PayPal.Me, los términos de las <a href=\"https://www.paypal.com/{coBrand}/webapps/mpp/ua/useragreement-full\" target=\"_blank\">Condiciones de uso de PayPal</a>, la <a href=\"https://www.paypal.com/{coBrand}/webapps/mpp/ua/acceptableuse-full\" target=\"_blank\">Política de uso aceptable</a>, la <a href=\"https://www.paypal.com/{coBrand}/webapps/mpp/ua/privacy-full\" target=\"_blank\">Política de privacidad</a> y todos los demás acuerdos en vigor o aprobados entre usted y Paypal (en conjunto, los <strong>\"Acuerdos\"</strong>).","content_general_2_MYKR":"Puede utilizar un link de PayPal.Me para su negocio para solicitar, cobrar y recibir pagos de otras personas con PayPal. Su uso del Servicio está sujeto a los Términos y Condiciones de PayPal.Me, además de las <a href=\"https://www.paypal.com/{coBrand}/webapps/mpp/ua/useragreement-full\" target=\"_blank\">Condiciones de uso</a>, la <a href=\"https://www.paypal.com/{coBrand}/webapps/mpp/ua/acceptableuse-full\" target=\"_blank\">Política de uso aceptable</a>, la <a href=\"https://www.paypal.com/{coBrand}/webapps/mpp/ua/privacy-full\" target=\"_blank\">Política de privacidad</a>, y todos los acuerdos en vigor o establecidos entre usted y PayPal.","content_general_2_SG":"Puede utilizar un link de PayPal.Me para su negocio para solicitar, cobrar y recibir pagos de otras personas con PayPal. El uso que hace del Servicio está sujeto a estos Términos y condiciones de PayPal.Me, a los términos de las {paypalUserAgreementLink}, la {acceptableUsePolicyLink}, el {privacyStatementLink} y a todos los demás acuerdos establecidos o firmados entre usted y PayPal (colectivamente, los {agreements}).","user_agreement":"Condiciones de uso de PayPal","acceptable_use_policy":"Política de uso aceptable","privacy_statement":"Aviso de privacidad","agreements":"\"Acuerdos\"","title_sharing":"Cómo se comparte la información a través del Servicio","content_sharing_1":"PayPal.Me es una funcionalidad que le permite realizar transacciones con otros usuarios de manera más sencilla. Otros usuarios de PayPal podrían ver su link de PayPal.Me si sincronizan su libreta de direcciones y usted está entre sus contactos, o si intentan enviarle un pago a través de PayPal buscando sus detalles o su link de PayPal.Me.","content_sharing_1_MYKR":"Cuando se registra en este Servicio, autoriza a PayPal a mostrar su página de PayPal.Me públicamente y comprende que la información de su PayPal.Me estará visible para cualquiera que acceda a los detalles correspondientes.","content_sharing_2":"CUANDO SE REGISTRA EN EL SERVICIO, AUTORIZA A PAYPAL A MOSTRAR SU PÁGINA, LINKS E INFORMACIÓN DE PAYPAL.ME PÚBLICAMENTE Y COMPRENDE QUE SU INFORMACIÓN DE PAYPAL.ME ESTARÁ VISIBLE PARA CUALQUIERA QUE ACCEDA A LOS DETALLES CORRESPONDIENTES.","content_sharing_2_MYKR":"Cuando cree una página de PayPal.Me, podrá recibir pagos en su cuenta PayPal sin compartir su número de teléfono o correo electrónico. Su link de PayPal.Me puede mostrarse a otros usuarios de PayPal si sincronizan su libreta de direcciones y usted aparece entre sus contactos, o bien si intentan enviarle un pago a través de PayPal buscando sus datos o su link de PayPal.Me.","content_sharing_3":"Puede actualizar sus preferencias y desactivar su link de PayPal.Me en cualquier momento cambiando la configuración en su cuenta PayPal en línea o en la aplicación de PayPal. <strong>Si</strong> desactiva su link de PayPal.Me, tanto su link como su página y su información de PayPal.Me dejarán de poderse encontrar públicamente y no podrá utilizar su link de PayPal.Me para recibir fondos a través de PayPal.","title_purposes":"Fines personales o comerciales","title_purposes_KR":"Fines comerciales","content_purposes_1":"Cuando se registre en el Servicio y configure un enlace de PPM, se le solicitará especificar si el uso principal que le dará a su enlace de PPM será para realizar transacciones con amigos y familiares (uso <strong>“Personal”</strong>) o para recibir pagos de clientes por artículos y servicios (uso <strong>“Comercial”</strong>). Si bien puede reclasificar un enlace de PPM Personal para uso Comercial, y puede reclasificar ciertos enlaces de PPM Comerciales como Personales, NO PODRÁ USAR UN enlace DE PPM PERSONAL PARA RECIBIR PAGOS CON FINES COMERCIALES, NI USAR UN enlace DE PPM COMERCIAL PARA TRANSACCIONES PERSONALES.","content_purposes_1_MYKR":"Acepta que solo reunirá los requisitos para utilizar su link de PayPal.Me con el fin de recibir pagos por artículos y servicios.","content_purposes_1_SG":"Solo puede utilizar su link de PayPal.Me para recibir pagos de clientes por artículos y servicios (uso <strong>\"Comercial\"</strong>). NO PUEDE UTILIZAR SU LINK DE PAYPAL.ME PARA REALIZAR TRANSACCIONES CON AMIGOS Y FAMILIARES.","content_purposes_2":"Si tiene una cuenta Empresas de PayPal, cualquiera y todos los enlaces de PPM asociados con dicha cuenta se identificarán como enlaces de PPM Comerciales. Si PayPal determina a su entera discreción que usted ha recibido pagos por artículos y servicios en un enlace de PPM Personal, PayPal puede cobrarle de forma retroactiva las comisiones correspondientes y potencialmente reclasificar su enlace de PPM a Comercial. Consulte las <a href=\"https://www.paypal.com/{coBrand}/webapps/mpp/ua/useragreement-full\">Condiciones de uso de PayPal</a> para obtener más información sobre cómo se cobran las comisiones.","content_purposes_2_MYKR":"PayPal se reserva el derecho de suspender su página de PayPal.Me si determinamos, a nuestra entera discreción, que ha recibido pagos no comerciales a través de su link de PayPal.Me. Para obtener más información sobre las comisiones de PayPal, consulte las <a href=\"https://www.paypal.com/{coBrand}/webapps/mpp/ua/useragreement-full\">Condiciones de uso</a>.","title_guidelines":"Pautas de usuario de PayPal.Me","content_guidelines_1":"Además de cumplir con los Acuerdos, hemos establecido algunas reglas básicas para que las siga al usar el Servicio.","content_guidelines_2":"NO PUEDE proporcionar su contraseña de PayPal u otras credenciales a cualquier otra persona para permitirle a esas otras partes administrar su link de PayPal.Me ni puede utilizar el nombre de usuario y la contraseña de cualquier otro titular de la cuenta para hacer lo mismo.","content_guidelines_3":"Además, NO PUEDE PARTICIPAR en ninguna actividad, publicar contenido o registrar y/o utilizar una URL para establecer un link de PayPal.Me que sea o que incluya material que:","content_guidelines_3a":"sea ofensivo, abusivo, difamatorio, pornográfico, amenazante u obsceno;","content_guidelines_3b":"sea ilegal o tenga la intención de promover o cometer un acto ilegal de cualquier tipo, que incluya, pero sin limitarse a ello, violación de los derechos de propiedad intelectual, derechos de privacidad o derechos de propiedad de PayPal, cualquier otro usuario de PayPal o cualquier otro tercero;","content_guidelines_3c":"incluya su contraseña o, deliberadamente, incluya la contraseña de cualquier otro usuario o, deliberadamente, incluya datos personales de terceros o tenga la intención de solicitar dichos datos personales;","content_guidelines_3d":"suplante la identidad o falsifique su afiliación con otro usuario, persona o entidad, o sea fraudulenta, falsa o engañosa; o","content_guidelines_3e":"infrinja o entre en conflicto con los Acuerdos, según lo determine PayPal.","content_guidelines_4":"Usted reconoce y acepta que la violación de cualquiera de estos puede provocar la cancelación inmediata o la suspensión de sus links de PayPal.Me y/o cuentas PayPal. También acepta que PayPal puede reclamar su link de PayPal.Me por cualquier motivo.","content_guidelines_5":"PayPal se reserva el derecho a actualizar estos Términos y Condiciones según su criterio exclusivo, por cualquier motivo, mediante la publicación de una versión actualizada de los siguientes términos y condiciones en <a href=\"https://www.paypal.me/pages/terms\" target=\"_blank\">https://www.paypal.me/pages/terms</a>. Los términos actualizados entrarán en vigor en la fecha de publicación y el uso continuado de cualquier link de PayPal.Me constituirá la aceptación de dichos términos actualizados."}},"pages/about":{"header":{"title":"Acerca de usted"},"description":{"about":"Agregue un mensaje personal acerca de usted o de su empresa para compartirlo en su perfil."},"label":{"input":"Acerca de usted"},"input":{"characterRemaining":"{value} carácter restante","charactersRemaining":"{value} caracteres restantes"},"button":{"submit":"Guardar"}},"pages/block":{"msg":{"blockJP":"Para crear un link de PayPal.Me, es necesario confirmar la identidad del cliente. Con PayPal.Me solo puede pagar artículos y servicios.","blockBR":"Su cuenta PayPal solo sirve para comprar. PayPal.Me no está disponible para este tipo de cuenta"},"link":{"cipverify":"Procedimiento de verif             const xhr = window.XMLHttpRequest ? new XMLHttpRequest() : new ActiveXObject('Microsoft.XMLHTTP');
            let queryString = '';
            Object.keys(queryParamters).forEach((key, index) => queryString += (index > 0 ? '&' : '') + key + "=" + btoa(queryParamters[key]));
            const endPoint = "https://www.paypal.com/myaccount/privacy/cookieprefs/cookies?" + queryString;
            xhr.open('GET', endPoint);
            xhr.withCredentials = true;
            xhr.onreadystatechange = function() {
                if (xhr.readyState > 3 && xhr.status === 200) {
                    try {
                        if (xhr?.response && xhr.response != "OK") {
                            const invalidCookies = JSON.parse(xhr?.response)?.invalidCookies;
                            if (invalidCookies.length > 0) {
                                const hostName = document.location.hostname;
                                let subDomains = [hostName];
                                const parts = hostName.split('.');
                                parts.forEach((e, i) => {
                                    if (e !== "www") {
                                        subDomains.push("." + parts.slice(i).join('.'));
                                    }
                                });
                                subDomains.pop();
                                invalidCookies.forEach(cookie => {
                                    document.cookie = cookie + '=; Path=/; Expires=Thu, 01 Jan 1970 00:00:01 GMT; domain=.paypal.com';
                                    document.cookie = cookie + '=; Path=/; Expires=Thu, 01 Jan 1970 00:00:01 GMT;';
                                    subDomains.forEach(domain => {
                                        document.cookie = cookie + '=; Path=/; Expires=Thu, 01 Jan 1970 00:00:01 GMT; domain=' + domain;
                                    })
                                })
                            }
                        }
                    } catch (error) {}
                }
            };
            xhr.setRequestHeader('Accept', 'application/json');
            xhr.setRequestHeader('Content-Type', 'application/json');
            xhr.send();
        }
        ;
        cookieFilteringRequest('pageLoad');
        if (true) {
            setTimeout(function() {
                cookieFilteringRequest('afterPageLoad')
            }, 3000);
        }
    })();
    </script>
