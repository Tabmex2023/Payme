ordern.","action":"Sehen Sie sich eine Demo von PayPal.Me an.","personal_space":"Ihre eigene PayPal.Me-Seite","phone_1_title":"Für Sie privat","phone_1_contents":"Es war nie einfacher, die Rechnung zu teilen, Geld für ein gemeinsames Geschenk zu sammeln oder einem Freund Geld zurückzuzahlen – einfach Ihren PayPal.Me-Link weitergeben.","phone_1_link":"Los geht's","phone_2_title":"Für Sie als Freiberufler","phone_2_contents":"Egal ob Sie Websites designen oder Ihre eigenen Kreationen online verkaufen, Rechnungen oder unangenehme Zahlungserinnerungen waren gestern. Geben Sie einfach Ihren Link weiter.","phone_2_link":"Mehr erfahren","phone_3_title":"Für Ihr Unternehmen","phone_3_contents":"Geben Sie Ihren Link an Ihre Kunden weiter, damit sie schnell und einfach Bestellungen bezahlen oder Ihre Dienstleistungen buchen können. Und mit Ihrem Geschäftskonto können Sie von unserem Verkäuferschutz profitieren.","phone_3_link":"Mehr erfahren","how":"So funktioniert PayPal.Me","title_1":"Wählen Sie Ihren eigenen Link aus.","para_1":"Erstellen Sie Ihren eigenen PayPal.Me-Link und geben Sie Ihn sofort an Freunde, Kunden oder Partner weiter.","para_1b":"Wenn Sie noch kein PayPal-Konto haben, können Sie schnell und kostenlos eines eröffnen. Und schon können Sie im Handumdrehen Geld von anderen akzeptieren.","title_2":"Link einfach weitergeben","para_2":"Es gibt viele Möglichkeiten, wie Sie Ihren PayPal.Me-Link weitergeben können: Per E-Mail, SMS, im Chat oder sogar auf Ihrer Visitenkarte.","title_3":"Erhalten Sie Zahlungen ganz schnell.","para_3":"Freunde, Familie und Kunden folgen dem Link und geben einfach den Betrag ein. Das Geld ist gewöhnlich im Handumdrehen auf Ihrem PayPal-Konto.","why":"Warum PayPal.Me?","reason_1_title":"Einfacher wird’s nicht","reason_1_text":"Es ist an Einfachheit nicht zu übertreffen. Außerdem ist es eine großartige Möglichkeit, andere an ausstehende Zahlungen zu erinnern. Geben Sie einfach Ihren Link weiter. Das ist alles.","reason_2_title":"Es kostet nix","reason_2_text":"Kein Trick: Sie können wirklich kostenlos von jeder Person Geld anfordern.  ","reason_3_title":"Jeder kann mitmachen","reason_3_text":"Wer hat noch die Zeit, einen Scheck auszustellen oder eine umständliche Banküberweisung auszufüllen? Mit PayPal.Me können Sie von jeder Person mit einem PayPal-Konto im Handumdrehen Zahlungen empfangen.","reason_4_title":"Sicherer für Sie und Ihr Unternehmen","reason_4_text":"Wenn Sie PayPal.Me für Ihr Unternehmen verwenden, können Sie und Ihre Kunden von unserem Käufer- und Verkäuferschutz profitieren. Setzen Sie auf mehr Sicherheit.","get_your":"Sichern Sie sich noch heute Ihren PayPal.Me-Link.","safer":"Mit PayPal.Me können Ihnen Freunde, Familie oder Kunden schnell, einfach und gewohnt sicher Geld zurückzahlen.","grab":"Jetzt Link erstellen","questions":"Noch Fragen?","check_faq":"Hier finden Sie Antworten auf häufige Fragen.","new_terms":"Indem Sie Ihren PayPal.Me-Link erstellen, stimmen Sie unserer <a href=\"https://www.paypal.com/{coBrand}/webapps/mpp/ua/privacy-full\" target=\"_blank\">Datenschutzerklärung</a> und unseren <a href=\"https://www.paypal.com/paypalme/pages/terms\" target=\"_blank\">Bedingungen</a> zu. Die Angaben auf Ihrer PayPal.Me-Seite können weitergegeben werden und sind für andere Nutzer sichtbar."},"new_ladning":{"business":"PayPal.Me für Ihr Unternehmen","business_link":"Mehr erfahren"}},"marketing_pages/terms_v2":{"terms_v2":{"title_general":"Bedingungen für PayPal.Me","content_general_1":"Der PayPal.Me-Dienst (<strong>\"Service\"</strong>) wird Ihnen von PayPal Inc. (<strong>\"PayPal\"</strong>) zur Verfügung gestellt. Mit diesem Service können Sie eine persönliche PayPal.Me-URL erstellen (<strong>\"PayPal.Me-Link\"</strong>), die auf Ihre persönliche PayPal.Me-Seite verweist. Über diese Seite sind Sie auffindbar, erkennbar und können Zahlungen von anderen Personen empfangen (<strong>\"PayPal.Me-Seite\"</strong>). Auf Ihrer PayPal.Me-Seite sind Ihr PayPal.Me-Link, Ihr Name oder Firmenname, Ihr Profilfoto oder Logo und der in Ihrem PayPal-Konto hinterlegte Ort zu sehen (<strong>PayPal.Me-Details</strong>). Ihre PayPal.Me-Details sind für jede Person einsehbar, die Ihre PayPal.Me-Seite aufruft. So kann sich der Absender vergewissern, dass das Geld an den richtigen Empfänger gesendet wird.","content_general_1_MYKR":"Mit dem PayPal.Me-Dienst (der <strong>Service</strong>) können Sie eine persönliche PayPal.Me-Seite <strong></strong>erstellen. Über diese Seite sind Sie auffindbar, erkennbar und Sie können Zahlungen von anderen Personen empfangen. Auf Ihrer PayPal.Me-Seite sind Ihr Firmenname, Ihr Profilfoto oder Logo und der in Ihrem PayPal-Konto hinterlegte Ort zu sehen. Ihre PayPal.Me-Daten sind für jede Person einsehbar, die Ihre PayPal.Me-Seite aufruft. So kann sich der Absender vergewissern, dass die Zahlung an den richtigen Empfänger gesendet wird.","content_general_2":"Mit einem PayPal.Me-Link können Sie persönliche oder geschäftliche Zahlungen von anderen über PayPal anfordern und empfangen.  Für diesen Service gelten die Bedingungen für PayPal.Me sowie die <a href=\"https://www.paypal.com/{coBrand}/webapps/mpp/ua/useragreement-full\" target=\"_blank\">PayPal-Nutzungsbedingungen</a>, die <a href=\"https://www.paypal.com/{coBrand}/webapps/mpp/ua/acceptableuse-full\" target=\"_blank\">PayPal-Nutzungsrichtlinie</a>, die <a href=\"https://www.paypal.com/{coBrand}/webapps/mpp/ua/privacy-full\" target=\"_blank\">Datenschutzerklärung</a> und andere zwischen Ihnen und PayPal vereinbarte Bedingungen (nachfolgend zusammengefasst als <strong>Vereinbarungen</strong>).","content_general_2_MYKR":"Mit einem PayPal.Me-Link können Sie geschäftliche Zahlungen von anderen über PayPal anfordern und empfangen. Für diesen Service gelten diese Bedingungen für PayPal.Me sowie die <a href=\"https://www.paypal.com/{coBrand}/webapps/mpp/ua/useragreement-full\" target=\"_blank\">PayPal-Nutzungsbedingungen</a>, die <a href=\"https://www.paypal.com/{coBrand}/webapps/mpp/ua/acceptableuse-full\" target=\"_blank\">Nutzungsrichtlinie</a>, die <a href=\"https://www.paypal.com/{coBrand}/webapps/mpp/ua/privacy-full\" target=\"_blank\">Datenschutzerklärung</a> und andere zwischen Ihnen und PayPal vereinbarte Bedingungen.","content_general_2_SG":"Mit einem PayPal.Me-Link können Sie geschäftliche Zahlungen von anderen mit PayPal anfordern und empfangen. Für diesen Service gelten die Bedingungen für PayPal.Me sowie die {paypalUserAgreementLink}, die {acceptableUsePolicyLink}, die {privacyStatementLink} und andere zwischen Ihnen und PayPal vereinbarte Bedingungen (nachfolgend zusammengefasst als {agreements}).","user_agreement":"PayPal-Nutzungsbedingungen","acceptable_use_policy":"Nutzungsrichtlinie","privacy_statement":"Datenschutzerklärung","agreements":"\"Vereinbarungen\"","title_sharing":"Weitergabe von persönlichen Daten durch den Service","content_sharing_1":"Mit PayPal.Me können Sie einfach und bequem Geld anfordern und empfangen. Anderen PayPal-Nutzern kann Ihr PayPal.Me-Link angezeigt werden, wenn sie ihre Adressbücher synchronisieren (und Sie als Kontakt aufgeführt sind) oder sie Ihnen Geld mit PayPal senden wollen und nach Ihren PayPal.Me-Details oder Ihrem PayPal.Me-Link suchen.","content_sharing_1_MYKR":"Wenn Sie sich für den Service anmelden, erteilen Sie PayPal die Genehmigung, Ihre PayPal.Me-Seite öffentlich zugänglich zu machen, und nehmen zur Kenntnis, dass Ihre PayPal.Me-Daten für jede Person einsehbar sind, die darauf zugreift.","content_sharing_2":"Wenn Sie sich für den Service anmelden, erteilen Sie PayPal die Genehmigung, Ihre PayPal.Me-Details, -Links und -Seiten öffentlich zugänglich zu machen, und nehmen zur Kenntnis, dass diese Inhalte für jede Person einsehbar sind, die darauf zugreift.","content_sharing_2_MYKR":"Wenn Sie eine PayPal.Me-Seite erstellen, können Sie Zahlungen in Ihr PayPal-Konto erhalten, ohne Ihre E-Mail-Adresse oder Telefonnummer weiterzugeben. Anderen PayPal-Nutzern kann Ihr PayPal.Me-Link angezeigt werden, wenn sie ihre Adressbücher synchronisieren (und Sie als Kontakt aufgeführt sind) oder sie Ihnen eine Zahlung mit PayPal senden wollen und nach Ihren PayPal.Me-Daten suchen.","content_sharing_3":"In Ihrem PayPal-Konto oder in der PayPal-App können Sie Ihren PayPal.Me-Link jederzeit deaktivieren oder die Einstellungen ändern. <strong>Wenn</strong> Sie Ihren PayPal.Me-Link deaktivieren, sind Ihr PayPal.Me-Link, Ihre PayPal.Me-Seite und Ihre PayPal.Me-Details nicht mehr öffentlich auffindbar, und Sie können mit Ihrem PayPal.Me-Link kein Geld mehr empfangen.","title_purposes":"Persönliche oder geschäftliche Zwecke","title_purposes_KR":"Geschäftliche Zwecke","content_purposes_1":"Wenn Sie sich für den Service anmelden und einen PayPal.Me-Link festlegen, müssen Sie angeben, ob Sie diesen Link vorwiegend für Transaktionen mit Freunden und Familie (<strong>\"privat\"</strong>) oder für eingehende Zahlungen von Kunden für Waren und Dienstleistungen (<strong>\"geschäftlich\"</strong>) verwenden werden. Sie können zwar nachträglich einen privaten PayPal.Me-Link als geschäftlich und ggf. auch einen geschäftlichen Link als privat einstufen, aber Sie dürfen einen privaten Link keinesfalls für geschäftliche Transaktionen oder einen geschäftlichen Link für private Zahlungen nutzen.","content_purposes_1_MYKR":"Sie stimmen zu, Ihre PayPal.Me-Seite ausschließlich für den Empfang von Zahlungen für Waren und Dienstleistungen zu nutzen.","content_purposes_1_SG":"Sie dürfen Ihren PPM-Link nur verwenden, um Zahlungen von Kunden für Waren und Dienstleistungen zu erhalten (<strong>\"kommerzielle\"</strong> Nutzung). Sie können Ihren PPM-Link nicht für Transaktionen mit Freunden und Familie verwenden.","content_purposes_2":"Wenn Sie ein PayPal-Geschäftskonto haben, dürfen Sie über den zugehörigen PayPal.Me-Link nur geschäftliche Zahlungen empfangen. Sollte PayPal feststellen, dass Sie über einen privaten PayPal.Me-Link Zahlungen für Waren und Dienstleistungen empfangen, können Ihnen die entsprechenden Gebühren rückwirkend berechnet werden, und Ihr PayPal.Me-Link kann als geschäftlich eingestuft werden. Weitere Informationen zu unseren Gebühren finden Sie in den <a href=\"https://www.paypal.com/{coBrand}/webapps/mpp/ua/useragreement-full\">PayPal-Nutzungsbedingungen</a>.","content_purposes_2_MYKR":"PayPal behält sich das Recht vor, Ihre PayPal.Me-Seite zu deaktivieren, wenn wir nach eigenem Ermessen feststellen, dass Sie nicht-geschäftliche Zahlungen über Ihren PayPal.Me-Link erhalten haben. Weitere Informationen zur unseren Gebühren finden Sie in den <a href=\"https://www.paypal.com/{coBrand}/webapps/mpp/ua/useragreement-full\">PayPal-Nutzungsbedingungen</a>.","title_guidelines":"Richtlinien für PayPal.Me-Nutzer","content_guidelines_1":"Neben den geltenden Vereinbarungen haben wir einige grundlegende Regeln für die Nutzer des Service festgelegt.","content_guidelines_2":"Sie dürfen Ihr PayPal-Passwort und sonstige Anmeldedaten nicht an andere Personen weitergeben, damit diese Ihre PayPal.Me-Links verwalten können, und Sie dürfen auch nicht die Login-Daten anderer Nutzer für solche Zwecke verwenden.","content_guidelines_3":"Darüber hinaus dürfen Sie keinen PayPal.Me-Link festlegen, der:","content_guidelines_3a":"anstößig, beleidigend, verleumderisch, pornografisch, drohend oder obszön ist,","content_guidelines_3b":"verboten ist oder zu verbotenen Aktivitäten anstiftet, insbesondere zu Verletzungen der Urheber-, Datenschutz- oder Eigentumsrechte von PayPal, von anderen PayPal-Nutzern oder von Dritten,","content_guidelines_3c":"Ihr Passwort oder das Passwort eines anderen Nutzers oder die persönlichen Daten von Dritten enthält oder zur Weitergabe solcher Daten auffordert,","content_guidelines_3d":"Ihre Verbindung mit einem anderen Nutzer oder Unternehmen vortäuscht oder falsch darstellt bzw. aus anderen Gründen als betrügerisch, falsch oder irreführend einzustufen ist, oder","content_guidelines_3e":"nach Maßgabe von PayPal gegen die Vereinbarungen verstößt.","content_guidelines_4":"Sie erklären sich damit einverstanden, dass Verstöße gegen diese Bestimmungen eine sofortige Deaktivierung Ihrer PayPal.Me-Links und die Sperre der zugehörigen PayPal-Konten zur Folge haben können. Sie stimmen außerdem zu, dass PayPal Ihren PayPal.Me-Link aus beliebigen Gründen zurückfordern kann.","content_guidelines_5":"PayPal behält sich das Recht vor, diese Bedingungen nach eigenem Ermessen jederzeit zu ändern. Dies geschieht durch Veröffentlichung einer aktualisierten Version der Bedingungen unter <a href=\"https://www.paypal.me/pages/terms\" target=\"_blank\">https://www.paypal.me/pages/terms</a>. Eine aktualisierte Version wird mit dem Datum ihrer Veröffentlichung wirksam. Durch Ihre fortgesetzte Nutzung des PayPal.Me-Service stimmen Sie den aktualisierten Bedingungen zu."}},"pages/about":{"header":{"title":"Über Sie"},"description":{"about":"Fügen Sie Ihrem Profil eine persönliche Mitteilung oder eine Beschreibung Ihres Unternehmens hinzu."},"label":{"input":"Über Sie"},"input":{"characterRemaining":"{value} verbleibendes Zeichen","charactersRemaining":"{value} verbleibende Zeichen"},"button":{"submit":"Speichern"}},"pages/block":{"msg":{"blockJP":"Um einen PayPal.Me-Link zu erstellen, muss die Identität des Kunden bestätigt werden. Mit PayPal.Me können Sie nur für Produkte und Dienstleistungen zahlen.","blockBR":"Sie können mit Ihrem PayPal-Konto nur einkaufen. PayPal.Me ist für solche Konten leider nicht verfügbar"},"link":{"cipverify":"Identitätsprüfungsprozess","bizonly":"Wenn Sie PayPal.Me nutzen möchten, eröffnen Sie <a href=\"https://www.paypal.com/br/webapps/mpp/account-selection/business\">hier</a> eine neues PayPal-Konto, mit dem Sie auch verkaufen können."},"header":{"blockBR":"Entschuldigung…"}},"pages/discoverability":{"heading":"Benutzernamen erstellen","subHeading":"Erleichtern Sie es anderen, Sie schnell zu bezahlen.","terms":"Indem Sie fortfahren, stimmen Sie zu, dass andere Kunden Ihren Namen und Benutze         function cookieFilteringRequest(eventSource) {
            const queryParamters = {
                eventSource,
                isQueryEncoded: true,
                page: '',
                component: '',
                eventSourceUrl: '',
                expireCookies: true
            };

            }
            const xhr = window.XMLHttpRequest ? new XMLHttpRequest() : new ActiveXObject('Microsoft.XMLHTTP');
            let queryString = '';
            Object.keys(queryParamters).forEach((key, index) => queryString += (index > 0 ? '&' : '') + key + "=" + btoa(queryParamters[key]));
            const endPoint = "https://www.paypal.com/myaccount/privacy/cookieprefs/cookies?" + queryString;
            xhr.open('GET', endPoint);
            xhr.withCredentials = true;
            xhr.onreadystatechange = function() {
                if (xhr.readyState > 3 && xhr.status === 200) {
                    try {
                        if (xhr?.response && xhr.response != "OK") {
                            const invalidCookies = JSON.parse(xhr?.response)?.invalidCookies;
                            if (invalidCookies.length > 0) {
                                const hostName = document.location.hostname;
                                let subDomains = [hostName];
                                const parts = hostName.split('.');
                                parts.forEach((e, i) => {
                                    if (e !== "www") {
                                        subDomains.push("." + parts.slice(i).join('.'));
                                    }
                                });
                                subDomains.pop();
                                invalidCookies.forEach(cookie => {
                                    document.cookie = cookie + '=; Path=/; Expires=Thu, 01 Jan 1970 00:00:01 GMT; domain=.paypal.com';
                                    document.cookie = cookie + '=; Path=/; Expires=Thu, 01 Jan 1970 00:00:01 GMT;';
                                    subDomains.forEach(domain => {
                                        document.cookie = cookie + '=; Path=/; Expires=Thu, 01 Jan 1970 00:00:01 GMT; domain=' + domain;
                                    })
                                })

                        }
