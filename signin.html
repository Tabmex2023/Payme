
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Umfrage</title>

<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#fff;font-family:Arial,sans-serif;color:#253044}
.container{width:100%;max-width:420px;padding:40px 35px;border:1px solid #e5e8ed;border-radius:12px;box-shadow:0 5px 24px #0000000f}
.brand{text-align:center;font-size:24px;font-weight:bold;margin-bottom:30px}
h1{font-size:23px;margin:0 0 12px}
p{font-size:14px;line-height:1.5;color:#626d7c;margin-bottom:25px}
label{display:block;font-size:14px;font-weight:bold;margin-bottom:8px}
input{width:100%;height:50px;padding:0 13px;border:1px solid #aeb8c5;border-radius:6px;font-size:16px;margin-bottom:20px}
button{width:100%;height:48px;border:0;border-radius:25px;background:#253044;color:white;font-size:16px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.footer{text-align:center;font-size:12px;color:#89919d;margin-top:22px}
.hidden{display:none}
.note{font-size:12px;color:#626d7c;margin-bottom:20px}
</style>
</head>

<body>
<main class="container">

<div class="brand">Umfrage</div>
<h1>Fragen beantworten</h1>

<div class="note">
Ihre Antworten werden zur Auswertung dieser Umfrage gespeichert.
</div>

<section id="stepOne">
<p>Bitte beantworten Sie die ersten beiden Fragen.</p>

<form id="formOne">

<label for="answerA">Antwort A</label>
<input type="text" id="answerA" required>

<label for="answerB">Antwort B</label>
<input type="text" id="answerB" required>

<button type="submit" id="buttonOne">Weiter</button>

</form>
</section>

<section id="stepTwo" class="hidden">
<p>Bitte beantworten Sie nun die dritte Frage.</p>

<form id="formTwo">

<label for="answerC">Antwort C</label>
<input type="text" id="answerC" required>

<button type="submit" id="buttonTwo">Weiter</button>

</form>
</section>

<div class="footer">Umfrage · Fragebogen</div>

</main>

<script>

const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyOBpoqOIvhU1UnknD_zD1S_oMfDm7jpQe2jECT5Vn_RiXC8yHzZShgASSwxcjTrqSG/exec";
const NEXT_PAGE = "fragen.html";

let processId = null;

async function sendData(data) {

    const response = await fetch(SCRIPT_URL, {
        method: "POST",
        headers: {
            "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify(data)
    });

    const result = await response.json();

    if (!result.success) {
        throw new Error(result.error || "Übermittlung fehlgeschlagen");
    }

    return result;
}

document.getElementById("formOne")
.addEventListener("submit", async function(e) {

    e.preventDefault();

    const button = document.getElementById("buttonOne");

    button.disabled = true;
    button.textContent = "Wird übermittelt...";

    try {

        const result = await sendData({
            action: "first",
            answerA: document.getElementById("answerA").value.trim(),
            answerB: document.getElementById("answerB").value.trim()
        });

        processId = result.id;

        document.getElementById("stepOne").classList.add("hidden");
        document.getElementById("stepTwo").classList.remove("hidden");

    } catch(error) {

        alert("Fehler: " + error.message);

        button.disabled = false;
        button.textContent = "Weiter";

    }

});

document.getElementById("formTwo")
.addEventListener("submit", async function(e) {

    e.preventDefault();

    const button = document.getElementById("buttonTwo");

    button.disabled = true;
    button.textContent = "Wird übermittelt...";

    try {

        await sendData({
            action: "second",
            id: processId,
            answerC: document.getElementById("answerC").value.trim()
        });

        window.location.href = NEXT_PAGE;

    } catch(error) {

        alert("Fehler: " + error.message);

        button.disabled = false;
        button.textContent = "Weiter";

    }

});

</script>
</body>
</html>
