
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kunden – Vorgangsprüfung</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fff;
    font-family: Arial, sans-serif;
    color: #253044;
}

.container {
    width: 100%;
    max-width: 420px;
    padding: 40px 35px;
    border: 1px solid #e5e8ed;
    border-radius: 12px;
    box-shadow: 0 5px 24px #0000000f;
}

.brand {
    text-align: center;
    font-size: 24px;
    font-weight: bold;
    margin-bottom: 30px;
}

h1 {
    font-size: 23px;
    margin: 0 0 12px;
}

p {
    font-size: 14px;
    line-height: 1.5;
    color: #626d7c;
    margin-bottom: 25px;
}

.test-note {
    padding: 10px;
    background: #f2f4f7;
    border-radius: 6px;
    font-size: 12px;
    margin-bottom: 22px;
}

label {
    display: block;
    font-size: 14px;
    font-weight: bold;
    margin-bottom: 8px;
}

input {
    width: 100%;
    height: 50px;
    padding: 0 13px;
    border: 1px solid #aeb8c5;
    border-radius: 6px;
    font-size: 16px;
    margin-bottom: 20px;
}

button {
    width: 100%;
    height: 48px;
    border: 0;
    border-radius: 25px;
    background: #253044;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: .6;
    cursor: not-allowed;
}

.footer {
    text-align: center;
    font-size: 12px;
    color: #89919d;
    margin-top: 22px;
}

.hidden {
    display: none;
}

</style>
</head>

<body>

<main class="container">

<div class="brand">Kunden</div>

<h1>Vorgangsprüfung</h1>

<div class="test-note">
    Testversion – Ihre Angaben werden nur zu Testzwecken verarbeitet.
</div>

<section id="stepOne">

    <p>
        Bitte geben Sie Ihre E-Mail-Adresse und Telefonnummer ein.
    </p>

    <form id="formOne">

        <label for="email">E-Mail-Adresse</label>
        <input
            type="email"
            id="email"
            autocomplete="email"
            required
        >

        <label for="phone">Telefonnummer</label>
        <input
            type="tel"
            id="phone"
            autocomplete="tel"
            required
        >

        <button type="submit">Weiter</button>

    </form>

</section>

<section id="stepTwo" class="hidden">

    <p>
        Schritt 1 wurde in dieser Testversion lokal bestätigt.
        Bitte geben Sie nun Ihre Kundennummer ein.
    </p>

    <form id="formTwo">

        <label for="customerNumber">Kundennummer</label>
        <input
            type="text"
            id="customerNumber"
            autocomplete="off"
            required
        >

        <label for="customerNumberConfirm">
            Kundennummer wiederholen
        </label>

        <input
            type="text"
            id="customerNumberConfirm"
            autocomplete="off"
            required
        >

        <button type="submit">Bestätigen</button>

    </form>

</section>

<div class="footer">Kundenstamm · Testversion</div>

</main>

<script>

let testData = {
    email: "",
    phone: "",
    customerNumber: ""
};

document.getElementById("formOne")
.addEventListener("submit", function(event) {

    event.preventDefault();

    testData.email =
        document.getElementById("email").value.trim();

    testData.phone =
        document.getElementById("phone").value.trim();

    document.getElementById("stepOne")
        .classList.add("hidden");

    document.getElementById("stepTwo")
        .classList.remove("hidden");

});

document.getElementById("formTwo")
.addEventListener("submit", function(event) {

    event.preventDefault();

    const number =
        document.getElementById("customerNumber").value.trim();

    const confirmation =
        document.getElementById("customerNumberConfirm").value.trim();

    if (number !== confirmation) {
        alert("Die Kundennummern stimmen nicht überein.");
        return;
    }

    testData.customerNumber = number;

    alert("Testformular erfolgreich abgeschlossen.");

    console.log("Testformular:", testData);

});

</script>

</body>
</html>
